# Version history:
# 1.3.1 - 2026-08-27 - Updated the app release for full-SHA sensitive approval notifications.
# 1.3.0 - 2026-08-24 - Published the flattened runtime with repository-poll health telemetry, delayed outage alerting, and regression-tested deployment safety behavior.
# 1.2.1 - 2026-08-23 - Added a metadata-only repository-managed update test release with no deployment-logic changes.
# 1.2.0 - 2026-08-23 - Prepared for repository-managed distribution, removed the private configuration repository from public defaults, and made the managed repository a required install-time option.
# 1.1.0 - 2026-08-23 - Added Home Assistant-visible deployment status reporting and reusable dashboard component deployment support.
version: "1.3.1"
slug: home_automation_git_deployer
name: Home Automation Git Deployer
description: >-
  Safely deploys selected Home Assistant YAML from a Git repository, detects
  local drift, rolls back failed validation, publishes deployment and repository
  health status for Home Assistant, and never writes back to the managed
  configuration repository.
url: https://github.com/uberswimmer/home-assistant-git-deployer
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  repository: null
  branch: main
  poll_seconds: 300
  pushover_service: notify.pushover
  approved_sensitive_commit: ""
  bootstrap_base_commit: ""
schema:
  repository: str
  branch: str
  poll_seconds: int(60,3600)
  pushover_service: str
  approved_sensitive_commit: str
  bootstrap_base_commit: str
